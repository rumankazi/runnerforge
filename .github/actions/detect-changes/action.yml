name: Detect changed components
description: |
  Compares HEAD against the appropriate base ref and reports which named
  components changed. Components and their match patterns are passed in as
  the `filters` input — adding a new component is a caller-side change only.

  Patterns are shell globs (same style as .gitignore / dorny/paths-filter):
    apps/orchestrator/**     matches anything under apps/orchestrator/
    .github/workflows/*.yml  matches any .yml directly under .github/workflows/
    exact/path/file.txt      exact match

  Assumes the repo has been checked out with `fetch-depth: 0` in a prior step.

  --- Safety ---
  Pattern matching uses bash `[[ $file == $pattern ]]`, which is pattern
  comparison, NOT command execution. Special chars in patterns (`$(...)`,
  backticks, `;`, etc.) are treated as literal pattern characters; bash
  does NOT eval them as shell in `[[ ]]` context (see bash manual,
  "Conditional Expressions"). So no input sanitization is needed for the
  match itself.

  The real defense against malicious filter changes is CODEOWNERS gating
  `.github/`, not character stripping. Future contributors: do NOT try to
  "harden" this action by filtering chars from patterns — legitimate globs
  need `*`, `?`, `[`, `]`, and stripping them would break the action while
  adding no security.

inputs:
  filters:
    description: YAML map of component name → list of glob patterns.
    required: true

  force-all-on:
    description: |
      YAML list of glob patterns. If any matches a changed file, ALL components
      in `filters` are reported as true. Use for CI-infra files whose changes
      should exercise the whole pipeline.
    required: false
    default: '[]'

outputs:
  changes:
    description: JSON object mapping each filter name to a boolean. Use `fromJSON(...)` in caller `if:`.
    value: ${{ steps.diff.outputs.changes }}

runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        INPUT_FILTERS: ${{ inputs.filters }}
        INPUT_FORCE_ALL_ON: ${{ inputs.force-all-on }}
      run: |
        set -euo pipefail
        shopt -s globstar extglob nullglob

        # ---- Validate inputs ----
        # filters must be a non-empty YAML map
        if ! echo "$INPUT_FILTERS" | yq 'type == "!!map" and (keys | length > 0)' -r | grep -q '^true$'; then
          echo "::error::filters input must be a non-empty YAML map (component name → list of patterns)"
          exit 1
        fi

        # each filter value must be a YAML list
        while IFS= read -r _comp; do
          if ! echo "$INPUT_FILTERS" | yq ".\"$_comp\" | type == \"!!seq\"" -r | grep -q '^true$'; then
            echo "::error::filter '$_comp' must be a YAML list of glob patterns"
            exit 1
          fi
        done < <(echo "$INPUT_FILTERS" | yq 'keys | .[]' -r)

        # 1. Compute base ref.
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASE="${{ github.event.pull_request.base.sha }}"
        else
          BASE="${{ github.event.before }}"
          # First push to a branch: `before` is the zero-sha. Fall back to merge-base with main.
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE=$(git merge-base HEAD origin/main)
          fi
        fi

        mapfile -t CHANGED < <(git diff --name-only "$BASE" HEAD)
        echo "Base ref: $BASE"
        echo "Changed files:"
        printf '  %s\n' "${CHANGED[@]}"

        # match_any: returns 0 if any changed file matches any of the given globs.
        match_any() {
          local pattern file
          for pattern in "$@"; do
            [[ -z "$pattern" ]] && continue
            for file in "${CHANGED[@]}"; do
              [[ -z "$file" ]] && continue
              # shellcheck disable=SC2053  # pattern is intentionally unquoted for glob expansion
              if [[ "$file" == $pattern ]]; then
                return 0
              fi
            done
          done
          return 1
        }

        # 2. Check force-all-on patterns.
        FORCE=false
        mapfile -t FORCE_PATTERNS < <(echo "$INPUT_FORCE_ALL_ON" | yq '.[]' -r)
        for pattern in "${FORCE_PATTERNS[@]}"; do
          if match_any "$pattern"; then
            echo "force-all-on matched by: $pattern"
            FORCE=true
            break
          fi
        done

        # 3. Per-component filter → JSON.
        mapfile -t COMPONENTS < <(echo "$INPUT_FILTERS" | yq 'keys | .[]' -r)

        JSON='{'
        SEP=''
        for comp in "${COMPONENTS[@]}"; do
          if [[ "$FORCE" == "true" ]]; then
            JSON="${JSON}${SEP}\"$comp\":true"
          else
            mapfile -t PATTERNS < <(echo "$INPUT_FILTERS" | yq ".\"$comp\" | .[]" -r)
            if match_any "${PATTERNS[@]}"; then
              JSON="${JSON}${SEP}\"$comp\":true"
            else
              JSON="${JSON}${SEP}\"$comp\":false"
            fi
          fi
          SEP=','
        done
        JSON="${JSON}}"

        echo "Result: $JSON"
        echo "changes=$JSON" >> "$GITHUB_OUTPUT"
