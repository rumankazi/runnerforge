name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Mondays at 14:32 UTC — offset to avoid sync with other scheduled jobs.
    - cron: '32 14 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yaml

  analyze-python:
    name: CodeQL python
    needs: preflight
    # On PR/push: only if orchestrator paths changed.
    # On weekly schedule: always run (security baseline).
    if: github.event_name == 'schedule' || fromJSON(needs.preflight.outputs.changes).orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:python"

  analyze-javascript:
    name: CodeQL javascript-typescript
    needs: preflight
    if: github.event_name == 'schedule' || fromJSON(needs.preflight.outputs.changes).web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:javascript-typescript"
