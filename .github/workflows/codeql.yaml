name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Mondays at 14:32 UTC — offset to avoid sync with other scheduled jobs.
    - cron: '32 14 * * 1'

permissions: {}

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yaml

  analyze-python:
    name: CodeQL python
    needs: preflight
    # On PR/push: only if orchestrator paths changed.
    # On weekly schedule: always run (security baseline).
    if: github.event_name == 'schedule' || fromJSON(needs.preflight.outputs.changes).orchestrator
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:python"

  analyze-javascript:
    name: CodeQL javascript-typescript
    needs: preflight
    if: github.event_name == 'schedule' || fromJSON(needs.preflight.outputs.changes).web
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:javascript-typescript"
