name: Qualify Web

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mise activation
        uses: jdx/mise-action@v4
        with:
          working_directory: apps/web

      - name: Sync packages
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run types:check

      - name: Build
        run: bun run build
