name: Qualify Web

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  qualify-web:
    name: 🕸️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Mise activation
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: apps/web

      - name: Sync packages
        run: bun install --frozen-lockfile

      # No `bun audit` here on purpose. It queries a live advisory feed, so a
      # newly published GHSA turns every open PR red at once, regardless of the
      # diff — and transitive advisories can't be fixed by the PR that trips
      # them. Auditing runs on a schedule instead (audit-deps.yaml), which
      # files an issue. This job stays a signal the PR author can act on.
      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run types:check

      - name: Build
        run: bun run build
