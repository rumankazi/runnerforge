name: Test Jobs

# THROWAWAY PROBE BRANCH, never merged. Dispatched with --ref to check, on
# runner image 0.5.0: (1) does actions/setup-python work on Debian 12,
# (2) does official Node 26 start, (3) which disk does a docker pull fill.

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: "unused on this branch"
        default: "10"
        type: string
        required: false

permissions: {}

jobs:
  probe:
    name: Image probe
    runs-on: [runnerforge, small, spot]
    steps:
      - name: Environment
        run: |
          set -x
          cat /etc/os-release
          ls -l /etc/lsb-release || echo "no /etc/lsb-release"
          df -h / /home/runner/actions-runner/_work
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          docker info --format 'root={{.DockerRootDir}} driver={{.Driver}} status={{json .DriverStatus}}'
          ls -ld /var/lib/docker /var/lib/containerd || true

      - name: setup-node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Node starts
        run: node --version && ldd "$(command -v node)" | grep -E 'atomic|not found' || true

      - name: setup-python 3.13
        id: py
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: setup-python outcome
        env:
          OUTCOME: ${{ steps.py.outcome }}
        run: |
          echo "setup-python outcome: $OUTCOME"
          command -v python3 && python3 --version

      - name: Which disk a docker pull fills
        run: |
          df -B1M --output=target,used / /home/runner/actions-runner/_work
          docker pull --quiet node:26
          docker image ls
          df -B1M --output=target,used / /home/runner/actions-runner/_work
          docker system df
