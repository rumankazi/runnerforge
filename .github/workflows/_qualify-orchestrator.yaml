name: Qualify Orchestrator

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/orchestrator

jobs:
  qualify-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mise
        uses: jdx/mise-action@v4
        with:
          working_directory: apps/orchestrator

      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check

      - name: Format
        run: |
          uv run ruff format --check

      - name: Pytests
        run: uv run pytest
