name: Qualify Orchestrator

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualify-orchestrator:
    name: 🔱
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mise
        uses: jdx/mise-action@v4
        with:
          working_directory: apps/orchestrator

      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check

      - name: Format
        run: |
          uv run ruff format --check

      - name: 🧪
        run: uv run pytest

  container-test:
    name: 🐳
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build test stage
        run: docker build -f apps/orchestrator/Dockerfile --target test .
