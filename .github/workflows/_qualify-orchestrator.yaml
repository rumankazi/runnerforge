name: Qualify Orchestrator

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualify-orchestrator:
    name: 🐍
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          working_directory: apps/orchestrator

      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check

      - name: Format
        run: |
          uv run ruff format --check

      - name: Bandit
        run: uv run bandit -r src/ -ll -ii

      - name: pip-audit
        run: uv run pip-audit --skip-editable

      - name: 🧪
        run: uv run pytest

  container-test:
    name: 🐳
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build test stage
        run: docker build -f apps/orchestrator/Dockerfile --target test .

      - name: Build runtime stage
        run: docker build -f apps/orchestrator/Dockerfile --target runtime -t orchestrator:probe .

      - name: Generate throwaway RSA key
        run: openssl genrsa -out /tmp/probe-key.pem 2048

      - name: Start container
        run: |
          docker run -d \
            --name probe \
            -p 8000:8000 \
            -v /tmp/probe-key.pem:/secrets/private-key.pem:ro \
            -e GITHUB_WEBHOOK_SECRET=ci-probe-not-a-secret \
            -e GITHUB_APP_ID=12345 \
            -e GITHUB_APP_PRIVATE_KEY_PATH=/secrets/private-key.pem \
            -e GCP_PROJECT_ID=ci-probe-project \
            -e RUNNER_VM_SA_EMAIL=ci-probe@example.iam.gserviceaccount.com \
            -e EXPECTED_SCHEDULER_SA_EMAIL=ci-probe@example.iam.gserviceaccount.com \
            -e EXPECTED_AUDIENCE=https://ci-probe.example \
            orchestrator:probe

      - name: Wait for /health
        run: |
          for _ in {1..15}; do
            if curl -sf http://localhost:8000/health; then
              echo
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container did not respond to /health within 15s"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs probe

      - name: Stop container
        if: always()
        run: docker rm -f probe

      - name: Trivy scan
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orchestrator:probe
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Generate SBOM
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: orchestrator:probe
          format: cyclonedx-json
