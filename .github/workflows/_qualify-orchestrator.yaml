name: Qualify Orchestrator

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualify-orchestrator:
    name: 🐍
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          working_directory: apps/orchestrator

      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check

      - name: Format
        run: |
          uv run ruff format --check

      # Bandit stays here: it analyses our own source, so the same code always
      # gives the same answer and a failure is the PR author's to fix.
      - name: Bandit
        run: uv run bandit -r src/ -ll -ii

      # No `pip-audit` here on purpose — same reasoning as `bun audit` in
      # _qualify-web.yaml. It queries a live advisory feed, so a newly
      # published advisory fails every open PR at once regardless of the diff,
      # and transitive findings can't be fixed by the PR that trips them.
      # It runs on a schedule instead (audit-deps.yaml), which files an issue.
      - name: 🧪
        run: uv run pytest

  container-test:
    name: 🐳
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build test stage
        run: docker build -f apps/orchestrator/Dockerfile --target test .

      - name: Build runtime stage
        run: docker build -f apps/orchestrator/Dockerfile --target runtime -t orchestrator:probe .

      - name: Generate throwaway RSA key
        run: openssl genrsa -out /tmp/probe-key.pem 2048

      - name: Start container
        run: |
          docker run -d \
            --name probe \
            -p 8000:8000 \
            -v /tmp/probe-key.pem:/secrets/private-key.pem:ro \
            -e GITHUB_WEBHOOK_SECRET=ci-probe-not-a-secret \
            -e GITHUB_APP_ID=12345 \
            -e GITHUB_APP_PRIVATE_KEY_PATH=/secrets/private-key.pem \
            -e GCP_PROJECT_ID=ci-probe-project \
            -e RUNNER_VM_SA_EMAIL=ci-probe@example.iam.gserviceaccount.com \
            -e EXPECTED_SCHEDULER_SA_EMAIL=ci-probe@example.iam.gserviceaccount.com \
            -e EXPECTED_AUDIENCE=https://ci-probe.example \
            orchestrator:probe

      - name: Wait for /health
        run: |
          for _ in {1..15}; do
            if curl -sf http://localhost:8000/health; then
              echo
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container did not respond to /health within 15s"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs probe

      - name: Stop container
        if: always()
        run: docker rm -f probe

      # No Trivy gate here on purpose — same reasoning as `pip-audit` above and
      # `bun audit` in _qualify-web.yaml. It resolves against a live
      # vulnerability feed, so its answer changes without the code changing.
      # As a required check that meant a newly published advisory blocked every
      # open orchestrator PR at once: three CVEs landing after 2026-07-30 froze
      # the whole queue, including a release PR whose diff was a CHANGELOG and a
      # version number. Two of the three were not even installed packages —
      # they were files bundled inside the base image, unfixable from any PR.
      # It runs on a schedule instead (audit-deps.yaml), which files an issue.
      #
      # The deterministic parts of this job stay: the image has to build, the
      # test stage has to pass pytest, and the container has to answer /health.

      - name: Generate SBOM
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: orchestrator:probe
          format: cyclonedx-json
