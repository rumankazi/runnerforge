name: Deploy Runner Image

on:
  push:
    paths:
      - '.github/workflows/deploy-runner-image.yaml'
      - '.github/workflows/scripts/smoke-test.sh'
      - 'infra/packer/**'
  release:
    types: [published] # setup job filters to runner-image-v* tags only
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: 'deploy = full pipeline (build + publish → smoke test → promote to image family). rollback = remove image from the image family (instant, approval-gated)'
        options: [deploy, rollback]
        default: deploy
      target:
        description: 'For deploy: version (e.g. 1.2.3). For rollback: image name (e.g. runnerforge-runner-base-image-1.1.2)'
        required: true

permissions: {}

concurrency:
  group: deploy-runner-image
  cancel-in-progress: false
env:
  WIF_PROVIDER: projects/8547588670/locations/global/workloadIdentityPools/github/providers/github
  CI_RUNNER_IMAGE_BUILD_SA: ci-runner-image-build@runnerforge.iam.gserviceaccount.com
  CI_VM_LOGGER_SA: ci-vm-logger@runnerforge.iam.gserviceaccount.com

jobs:
  setup:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.parse.outputs.action }}
      target: ${{ steps.parse.outputs.target }}
    steps:
      - id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          DISPATCH_ACTION: ${{ github.event.inputs.action }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ ! "$TAG_NAME" =~ ^runner-image-v ]]; then
              echo "Tag '$TAG_NAME' is not an runner-image-v* release — skipping."
              echo "action=skip" >> "$GITHUB_OUTPUT"
              echo "target="     >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="${TAG_NAME#runner-image-v}"
            VERSION="${VERSION//./-}" # replacing dots with dashes
            echo "Release deploy: $VERSION"
            echo "action=deploy"   >> "$GITHUB_OUTPUT"
            echo "target=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Dispatch $DISPATCH_ACTION: $DISPATCH_TARGET"
            echo "action=$DISPATCH_ACTION" >> "$GITHUB_OUTPUT"
            echo "target=$DISPATCH_TARGET" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build + Publish
    needs: setup
    # if: needs.setup.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/packer
    permissions:
      contents: read    # actions/checkout
      id-token: write   # WIF
    env:
      TARGET: ${{ needs.setup.outputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_RUNNER_IMAGE_BUILD_SA }}

      - name: Setup `packer`
        uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189

      - name: Run `packer init`
        run: "packer init ./runner-image.pkr.hcl"

      - name: Run `packer validate`
        run: "packer validate ./runner-image.pkr.hcl"

      - name: Build + publish image
        run: |
          processed_tag="${TARGET:-0.0.1}"   # fallback if TARGET unset
          processed_tag="${processed_tag#v}"   # strip leading v
          packer build -var "tag=${processed_tag}" ./runner-image.pkr.hcl

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build, setup]
    permissions:
      contents: read    # actions/checkout
      id-token: write   # WIF
    env:
      TARGET: ${{ needs.setup.outputs.target }}
      ZONE: europe-west4-a
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_RUNNER_IMAGE_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Create smoke VM
        id: create-vm
        run: |
          set -euo pipefail
          processed_tag="${TARGET:-0.0.1}"   # fallback if TARGET unset
          processed_tag="${processed_tag#v}"   # strip leading v
          processed_tag="${processed_tag//./-}" # replacing dots with dashes
          instance_name="rf-smoke-test-${{ github.run_id }}"
          startup_script="${{ github.workspace }}/.github/workflows/scripts/smoke-test.sh"

          gcloud compute instances create "$instance_name" \
            --machine-type="e2-medium" \
            --image="projects/runnerforge/global/images/runnerforge-runner-base-image-${processed_tag}" \
            --image-project="runnerforge" \
            --zone="$ZONE" \
            --service-account="$CI_VM_LOGGER_SA" \
            --scopes=cloud-platform \
            --metadata-from-file "startup-script=$startup_script" \
            --labels="runner=runnerforge,job_id=${{ github.run_id }},repo=rumankazi_runnerforge"

          echo "Instance $instance_name created."
          echo "instance_name=$instance_name" >> "$GITHUB_OUTPUT"
          instance_id=$(gcloud compute instances describe "$instance_name" --zone "$ZONE" --format='value(id)')
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Verify runner binary readiness (serial console)
        env:
          VM: ${{ steps.create-vm.outputs.instance_name }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 )) # 5 minutes
          while [[ $(date +%s) -lt $deadline ]]; do
            out=$(gcloud compute instances get-serial-port-output "$VM" --zone "$ZONE" || true)
            if grep -q "SMOKE_OK" <<< "$out"; then echo "Runner binary readiness: OK"; exit 0; fi
            if grep -q "SMOKE_NOK" <<< "$out"; then
              echo "::error::Runner binary readiness: FAILED"
              grep "SMOKE_NOK" <<< "$out"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Runner binary readiness: TIMEOUT (no marker on serial console within 5 min)"
          exit 1

      - name: Verify Cloud Ops Agent log delivery
        env:
          INSTANCE_ID: ${{ steps.create-vm.outputs.instance_id }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          while [[ $(date +%s) -lt $deadline ]]; do
            count=$(gcloud logging read \
              "resource.type=\"gce_instance\" AND resource.labels.instance_id=\"$INSTANCE_ID\"" \
              --limit 1 --format='value(timestamp)' | wc -l)
            if [[ "$count" -gt 0 ]]; then echo "Cloud Ops Agent log delivery: OK"; exit 0; fi
            sleep 10
          done
          echo "::error::Cloud Ops Agent log delivery: TIMEOUT (no logs from instance $INSTANCE_ID within 5 min)"
          exit 1

      - name: Cleanup smoke VM
        if: always()
        env:
          VM: ${{ steps.create-vm.outputs.instance_name }}
        run: |
          gcloud compute instances delete "$VM" --zone "$ZONE" --quiet || true
