name: Dependency Audit

# Advisory scanning runs here, on a schedule, rather than in the PR gate.
# `bun audit` and `pip-audit` resolve against a live advisory feed, so their
# result changes without the code changing — as required PR checks that means
# an advisory published overnight blocks every open PR, including ones that
# cannot fix it because the offending package is transitive. Here a finding
# opens/updates a tracking issue and the run stays green.
#
# Deterministic scanners stay in the PR gate where they belong: `bandit`
# analyses our own source and gives the same answer for the same code, so a
# failure there is always the author's to fix.

on:
  schedule:
    - cron: "23 7 * * *" # daily 07:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-deps
  cancel-in-progress: true

jobs:
  web:
    name: Audit web
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Mise activation
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          working_directory: apps/web

      - name: Sync packages
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Audit
        id: audit
        working-directory: apps/web
        run: |
          set +e
          bun audit >"$RUNNER_TEMP/audit-web.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/audit-web.txt"
          if [ "$code" -eq 0 ]; then
            echo "found=false" >>"$GITHUB_OUTPUT"
          else
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Report
        uses: ./.github/actions/audit-issue
        with:
          app: apps/web
          found: ${{ steps.audit.outputs.found }}
          report-file: ${{ runner.temp }}/audit-web.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          remediation: |
            Refreshing the lockfile (`bun install`) clears advisories that have a
            patched release inside the existing range. Transitive ones usually
            need an entry in the `overrides` block of `apps/web/package.json` —
            and note that pinning a transitive package can force a major bump on
            whatever depends on it, so check lint/types/build after.

  orchestrator:
    name: Audit orchestrator
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Mise activation
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          working_directory: apps/orchestrator

      - name: Sync
        working-directory: apps/orchestrator
        run: uv sync --frozen

      - name: Audit
        id: audit
        working-directory: apps/orchestrator
        run: |
          set +e
          uv run pip-audit --skip-editable >"$RUNNER_TEMP/audit-orchestrator.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/audit-orchestrator.txt"
          if [ "$code" -eq 0 ]; then
            echo "found=false" >>"$GITHUB_OUTPUT"
          else
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Report
        uses: ./.github/actions/audit-issue
        with:
          app: apps/orchestrator
          found: ${{ steps.audit.outputs.found }}
          report-file: ${{ runner.temp }}/audit-orchestrator.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          remediation: |
            Re-resolving the lockfile (`uv lock --upgrade-package <name>`) clears
            advisories that have a patched release inside the existing range. For
            transitive packages, add a constraint to `[project.dependencies]` in
            `apps/orchestrator/pyproject.toml` to pull the resolver forward.

  # Image scanning, moved here out of the orchestrator PR gate for exactly the
  # reasons in the header: Trivy resolves against a live feed, and it scans
  # every package it can find in the image — including ones bundled in the base
  # image that no PR can fix.
  container:
    name: Audit orchestrator image
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build -f apps/orchestrator/Dockerfile --target runtime -t orchestrator:probe .

      - name: Scan
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orchestrator:probe
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          output: ${{ runner.temp }}/audit-container.txt

      - name: Collect result
        id: audit
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/audit-container.txt"

          # A non-empty report means findings. An empty or missing one with a
          # failed step means Trivy itself broke, which is also worth an issue —
          # say so rather than filing a blank report.
          if [ ! -s "$report" ]; then
            if [ "$OUTCOME" = "success" ]; then
              echo "No vulnerabilities found." >"$report"
            else
              echo "Trivy did not produce a report; the scan step failed. See the run log." >"$report"
            fi
          fi

          cat "$report"

          if [ "$OUTCOME" = "success" ]; then
            echo "found=false" >>"$GITHUB_OUTPUT"
          else
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Report
        uses: ./.github/actions/audit-issue
        with:
          app: apps/orchestrator (container image)
          found: ${{ steps.audit.outputs.found }}
          report-file: ${{ runner.temp }}/audit-container.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          remediation: |
            Findings fall into two kinds, and they are fixed differently.

            Packages we depend on show up under an `app/.venv/.../METADATA`
            target — bump them with `uv lock --upgrade-package <name>` in
            `apps/orchestrator`.

            Packages we do *not* depend on show up under a bare `Python` target
            with no file path, and `uv tree --no-dev` will not list them. Those
            are bundled inside the base image, so there is nothing to upgrade;
            either remove the bundling files in the Dockerfile's base stage (as
            we already do for `pip` and `ensurepip`) or wait for a newer base
            image digest. Confirm which kind you have before trying to fix it —
            an upgrade for the second kind is silently a no-op.
