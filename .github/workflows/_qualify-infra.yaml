name: Qualify Infra

on:
  workflow_call:
    secrets:
      RELEASE_BOT_APP_ID:
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        required: true
    outputs:
      has_changes:
        description: "True if terraform plan detected changes"
        value: ${{ jobs.qualify-infra.outputs.has_changes}}

jobs:
  qualify-infra:
    name: ☁️
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      WIF_PROVIDER: projects/8547588670/locations/global/workloadIdentityPools/github/providers/github
      CI_TERRAFORM_PLAN_SA: ci-terraform-plan@runnerforge.iam.gserviceaccount.com
      TFACTION_JOB_TYPE: terraform
      TFACTION_IS_APPLY: "false"
      TFACTION_WORKING_DIR: infra/terraform
    outputs:
      has_changes: ${{ steps.plan.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_TERRAFORM_PLAN_SA }}

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.60.0

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Scope the token to only what tfaction actually does.
          # Caps the blast radius even if the App installation is later granted more perms.
          permission-pull-requests: write
          permission-contents: write
          permission-actions: read

      - name: Set up
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: setup
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Init
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: terraform-init
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Lint
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: test
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Plan
        id: plan
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: plan
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Conftest verify (policy unit tests)
        continue-on-error: true
        run: conftest verify -p infra/policies/

      - name: Conftest test (apply policies to plan)
        env:
          PLAN_JSON: ${{ steps.plan.outputs.plan_json}}
        run: conftest test "$PLAN_JSON" -p infra/policies/
