name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "tfaction-root.yaml"
      - "aqua.yaml"
      - ".github/workflows/apply-terraform.yaml"
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions: {}

env:
  WIF_PROVIDER: projects/8547588670/locations/global/workloadIdentityPools/github/providers/github
  CI_TERRAFORM_APPLY_SA: ci-terraform-apply@runnerforge.iam.gserviceaccount.com
  TFACTION_JOB_TYPE: terraform
  TFACTION_IS_APPLY: "true"
  TFACTION_WORKING_DIR: infra/terraform

jobs:
  plan-preview:
    uses: ./.github/workflows/_qualify-infra.yaml
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

    permissions:
      contents: read
      id-token: write
      pull-requests: write

  apply:
    name: ☁️
    runs-on: ubuntu-latest
    needs: plan-preview
    environment: prod-infra
    permissions:
      contents: read
      id-token: write
    env:
      WIF_PROVIDER: projects/8547588670/locations/global/workloadIdentityPools/github/providers/github
      CI_TERRAFORM_APPLY_SA: ci-terraform-apply@runnerforge.iam.gserviceaccount.com
      TFACTION_JOB_TYPE: terraform
      TFACTION_IS_APPLY: "true"
      TFACTION_WORKING_DIR: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_TERRAFORM_APPLY_SA }}

      - uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.60.0

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Scope the token to only what tfaction actually does.
          # Caps the blast radius even if the App installation is later granted more perms.
          permission-contents: write
          permission-pull-requests: write
          permissions-actions: read

      - name: Set up
        uses: suzuki-shunsuke/tfaction@6ad59de70ee7e9c0a11c665c4439b5c148c74328 # v2.0.1
        with:
          action: setup
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Init
        uses: suzuki-shunsuke/tfaction@6ad59de70ee7e9c0a11c665c4439b5c148c74328 # v2.0.1
        with:
          action: terraform-init
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Apply
        uses: suzuki-shunsuke/tfaction@6ad59de70ee7e9c0a11c665c4439b5c148c74328 # v2.0.1
        with:
          action: apply
          github_token: ${{ steps.app-token.outputs.token }}
