name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "infra/terraform-pool/**"
      - "tfaction-root.yaml"
      - "aqua.yaml"
      - ".github/workflows/deploy-infra.yaml"
  # No workflow_dispatch: tfaction's apply needs the merged PR's plan file. If
  # an apply fails after Terraform started changing resources, merge the
  # follow-up PR tfaction opens. Re-run the failed jobs only for failures before
  # Terraform touched state (auth, lock, artifact download): a saved plan is
  # stale once the state has moved.

# Two deploy-infra runs never overlap. Inside one run the control and pool
# applies may run in parallel: separate states, locks and drift issues. A newer
# pending run can still replace an older pending one; re-run the replaced run
# (drift detection flags it too).
concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions: {}

jobs:
  # Which targets this merge touched. An apply downloads the plan its PR made,
  # so it may only run for a target the PR planned (preflight.yaml's filters
  # are a superset of these).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          filters: |
            control:
              - infra/terraform/**
              - tfaction-root.yaml
              - aqua.yaml
            pool:
              - infra/terraform-pool/**
              - tfaction-root.yaml
              - aqua.yaml

  plan-preview:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.changes).control }}
    uses: ./.github/workflows/_qualify-infra.yaml
    with:
      working_directory: infra/terraform
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  plan-preview-pool:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.changes).pool }}
    uses: ./.github/workflows/_qualify-infra.yaml
    with:
      working_directory: infra/terraform-pool
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  apply:
    name: ☁️
    runs-on: ubuntu-latest
    needs: [changes, plan-preview]
    if: ${{ fromJSON(needs.changes.outputs.changes).control }}
    environment: prod-infra
    permissions:
      id-token: write # For OIDC. https://docs.github.com/en/actions/concepts/security/openid-connect
      # If you use GitHub Apps, please grant these permissions to the GitHub App instead
      contents: read # To checkout a private repository
      issues: write # For drift detection, and the apply result on the drift issue
      pull-requests: write # The apply result comment on the merged PR
      actions: read # To download plan files from GitHub Artifacts
    env:
      WIF_PROVIDER: projects/8547588670/locations/global/workloadIdentityPools/github/providers/github
      CI_TERRAFORM_APPLY_SA: ci-terraform-apply@runnerforge.iam.gserviceaccount.com
      TFACTION_JOB_TYPE: terraform
      TFACTION_IS_APPLY: "true"
      TFACTION_WORKING_DIR: infra/terraform
      # Wait for a PR plan (Renovate rebases every open PR on each merge)
      # instead of failing on the state lock.
      TF_CLI_ARGS_apply: -lock-timeout=10m
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_TERRAFORM_APPLY_SA }}

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.0

      - name: Get or create a drift issue
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        # CHECK: You can remove this step if you don't use drift detection
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/drift-detection
        with:
          action: get-or-create-drift-issue
          # issues:write - create a drift issue

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Scope the token to only what tfaction actually does.
          # Caps the blast radius even if the App installation is later granted more perms.
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read

      - name: Set up
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        id: setup
        with:
          action: setup
          # pull-requests:write
          github_token: ${{ steps.token.outputs.token }}

      - name: terraform init
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        with:
          # pull-requests:write
          action: terraform-init

      - name: Apply
        id: apply
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        with:
          # pull-requests:write
          action: apply

      - name: Update related PR branches
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/update-pr-branch
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        if: always()
        with:
          action: update-pr-branch
          # pull-requests:write
          # contents:write
          github_token: ${{ steps.token.outputs.token }}

      - name: Create follow up PR
        if: failure()
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/follow-up-pr
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        with:
          action: create-follow-up-pr
          # pull-requests:write
          # contents:write
          github_token: ${{ steps.token.outputs.token }}

      - name: Update a drift issue
        if: always()
        # CHECK: You can remove this step if you don't use drift detection
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/drift-detection
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        with:
          action: update-drift-issue
          status: ${{ job.status }}
          # issues:write

  # Same steps as apply. Both stay in this file: the apply service account's
  # WIF binding is pinned to deploy-infra.yaml (terraform_ci.tf).
  apply-pool:
    name: ☁️ pool
    runs-on: ubuntu-latest
    needs: [changes, plan-preview-pool]
    if: ${{ fromJSON(needs.changes.outputs.changes).pool }}
    environment: prod-infra
    permissions:
      id-token: write # For OIDC. https://docs.github.com/en/actions/concepts/security/openid-connect
      # If you use GitHub Apps, please grant these permissions to the GitHub App instead
      contents: read # To checkout a private repository
      issues: write # For drift detection, and the apply result on the drift issue
      pull-requests: write # The apply result comment on the merged PR
      actions: read # To download plan files from GitHub Artifacts
    env:
      WIF_PROVIDER: projects/8547588670/locations/global/workloadIdentityPools/github/providers/github
      CI_TERRAFORM_APPLY_SA: ci-terraform-apply@runnerforge.iam.gserviceaccount.com
      TFACTION_JOB_TYPE: terraform
      TFACTION_IS_APPLY: "true"
      TFACTION_WORKING_DIR: infra/terraform-pool
      # Wait for a PR plan (Renovate rebases every open PR on each merge)
      # instead of failing on the state lock.
      TF_CLI_ARGS_apply: -lock-timeout=10m
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_TERRAFORM_APPLY_SA }}

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.0

      - name: Get or create a drift issue
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        # CHECK: You can remove this step if you don't use drift detection
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/drift-detection
        with:
          action: get-or-create-drift-issue
          # issues:write - create a drift issue

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Scope the token to only what tfaction actually does.
          # Caps the blast radius even if the App installation is later granted more perms.
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read

      - name: Set up
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        id: setup
        with:
          action: setup
          # pull-requests:write
          github_token: ${{ steps.token.outputs.token }}

      - name: terraform init
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        with:
          # pull-requests:write
          action: terraform-init

      - name: Apply
        id: apply
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        with:
          # pull-requests:write
          action: apply

      - name: Update related PR branches
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/update-pr-branch
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        if: always()
        with:
          action: update-pr-branch
          # pull-requests:write
          # contents:write
          github_token: ${{ steps.token.outputs.token }}

      - name: Create follow up PR
        if: failure()
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/follow-up-pr
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        with:
          action: create-follow-up-pr
          # pull-requests:write
          # contents:write
          github_token: ${{ steps.token.outputs.token }}

      - name: Update a drift issue
        if: always()
        # CHECK: You can remove this step if you don't use drift detection
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/drift-detection
        uses: suzuki-shunsuke/tfaction@e892f1d582adb0c401caee0e768c9bd7b063e86e # v2.3.4
        with:
          action: update-drift-issue
          status: ${{ job.status }}
          # issues:write
