name: Deploy Smoke (WIF)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Google auth provider
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKFLOW_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_BUILD_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Describe project
        run: gcloud projects describe runnerforge
