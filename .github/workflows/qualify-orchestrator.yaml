name: Qualify Orchestrator

on:
  pull_request:
    paths:
      - 'apps/orchestrator/**'
      - '.github/workflows/qualify-orchestrator.yaml'

  push:
    branches: [main]
    paths:
      - 'apps/orchestrator/**'
      - '.github/workflows/qualify-orchestrator.yaml'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/orchestrator

concurrency:
  group: qualify-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mise activation
        uses: jdx/mise-action@v4

      - name: Sync packages
        run: uv sync --frozen

      - name: Ruff lint
        run: |
          uv run ruff check

      - name: Ruff format check
        run: |
          uv run ruff format --check

      - name: Pytests
        run: uv run pytest
