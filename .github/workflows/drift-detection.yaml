name: Drift Detection

on:
  schedule:
    - cron: "17 8 * * *"   # daily 08:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-drift
  cancel-in-progress: true   # newer scheduled run replaces stale one

env:
  WIF_PROVIDER: projects/8547588670/locations/global/workloadIdentityPools/github/providers/github
  CI_TERRAFORM_PLAN_SA: ci-terraform-plan@runnerforge.iam.gserviceaccount.com

jobs:
  pick-out:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.pick-out.outputs.issues }}
      has_issues: ${{ steps.pick-out.outputs.has_issues }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: suzuki-shunsuke/tfaction@45bd9d6d7f1c396b5f1ca6f4d31dd8247e812539 # v2.0.3
        id: pick-out
        with:
          action: pick-out-drift-issues

  detect:
    timeout-minutes: 20
    name: "detect (${{ matrix.issue.target }})"
    runs-on: ${{ matrix.issue.runs_on }}
    needs: pick-out
    permissions:
      issues: write
      contents: read
      id-token: write   # WIF token exchange for GCP auth
    if: fromJSON(needs.pick-out.outputs.has_issues)
    strategy:
      fail-fast: false
      matrix:
        issue: ${{fromJSON(needs.pick-out.outputs.issues)}}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_TERRAFORM_PLAN_SA }}

      - uses: suzuki-shunsuke/tfaction@45bd9d6d7f1c396b5f1ca6f4d31dd8247e812539 # v2.0.3
        with:
          action: set-drift-env
          issue: ${{toJSON(matrix.issue)}}

      - uses: suzuki-shunsuke/tfaction@45bd9d6d7f1c396b5f1ca6f4d31dd8247e812539 # v2.0.3
        with:
          action: setup

      - name: terraform init
        uses: suzuki-shunsuke/tfaction@45bd9d6d7f1c396b5f1ca6f4d31dd8247e812539 # v2.0.3
        with:
          action: terraform-init

      - uses: suzuki-shunsuke/tfaction@45bd9d6d7f1c396b5f1ca6f4d31dd8247e812539 # v2.0.3
        with:
          action: test

      - uses: suzuki-shunsuke/tfaction@45bd9d6d7f1c396b5f1ca6f4d31dd8247e812539 # v2.0.3
        with:
          action: plan

      - uses: suzuki-shunsuke/tfaction@45bd9d6d7f1c396b5f1ca6f4d31dd8247e812539 # v2.0.3
        if: always()
        with:
          action: update-drift-issue
          status: ${{job.status}}
