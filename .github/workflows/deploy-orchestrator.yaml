name: Deploy Orchestrator

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: 'deploy = full pipeline (build → canary → approval → ramp). rollback = update-traffic to an existing revision (instant, approval-gated).'
        options: [deploy, rollback]
        default: deploy
      target:
        description: 'For deploy: version (e.g. 0.2.0). For rollback: revision name (e.g. runnerforge-orchestrator-00026-xyz).'
        required: true

permissions: {}

concurrency:
  group: deploy-orchestrator
  cancel-in-progress: false

env:
  AR_HOST: europe-west4-docker.pkg.dev
  AR_REPO: runnerforge/orchestrator/orchestrator
  REGION: europe-west4
  SERVICE: runnerforge-orchestrator
  WIF_PROVIDER: projects/8547588670/locations/global/workloadIdentityPools/github/providers/github
  CI_BUILD_SA: ci-build@runnerforge.iam.gserviceaccount.com

jobs:
  setup:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.parse.outputs.action }}
      target: ${{ steps.parse.outputs.target }}
    steps:
      - id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          DISPATCH_ACTION: ${{ github.event.inputs.action }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ ! "$TAG_NAME" =~ ^orchestrator-v ]]; then
              echo "Tag '$TAG_NAME' is not an orchestrator-v* release — skipping."
              echo "action=skip" >> "$GITHUB_OUTPUT"
              echo "target="     >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="${TAG_NAME#orchestrator-v}"
            echo "Release deploy: $VERSION"
            echo "action=deploy"   >> "$GITHUB_OUTPUT"
            echo "target=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Dispatch $DISPATCH_ACTION: $DISPATCH_TARGET"
            echo "action=$DISPATCH_ACTION" >> "$GITHUB_OUTPUT"
            echo "target=$DISPATCH_TARGET" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build + Push + Sign
    needs: setup
    if: needs.setup.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read    # actions/checkout
      id-token: write   # WIF + Cosign keyless
    env:
      TARGET: ${{ needs.setup.outputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker auth for AR
        run: gcloud auth configure-docker "${AR_HOST}" --quiet

      - name: Build runtime image
        run: |
          docker build \
            -f apps/orchestrator/Dockerfile \
            --target runtime \
            -t "${AR_HOST}/${AR_REPO}:${TARGET}" \
            .

      - name: Push to Artifact Registry
        run: docker push "${AR_HOST}/${AR_REPO}:${TARGET}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign keyless sign (Sigstore + Rekor)
        run: |
          cosign sign --yes "${AR_HOST}/${AR_REPO}:${TARGET}"

  canary:
    name: Canary 5%
    needs: [setup, build]
    if: needs.setup.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # WIF
    env:
      TARGET: ${{ needs.setup.outputs.target }}
    outputs:
      revision_name: ${{ steps.deploy.outputs.revision_name }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy new revision at 0% traffic
        id: deploy
        run: |
          set -euo pipefail
          REV=$(gcloud run services update "${SERVICE}" \
            --region "${REGION}" \
            --image "${AR_HOST}/${AR_REPO}:${TARGET}" \
            --no-traffic \
            --format='value(status.latestCreatedRevisionName)' \
            --quiet)
          echo "New revision: $REV"
          echo "revision_name=$REV" >> "$GITHUB_OUTPUT"

      - name: Send 5% traffic to new revision
        env:
          REVISION: ${{ steps.deploy.outputs.revision_name }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" \
            --to-revisions="${REVISION}=5" \
            --quiet

  ramp:
    name: Ramp 100% (approval gated)
    needs: [setup, canary]
    if: needs.setup.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # WIF
    environment:
      name: prod
      url: https://runnerforge-orchestrator-gsqedgmwha-ez.a.run.app
    env:
      REVISION: ${{ needs.canary.outputs.revision_name }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Ramp to 100%
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" \
            --to-revisions="${REVISION}=100" \
            --quiet

  rollback:
    name: Rollback to existing revision
    needs: setup
    if: needs.setup.outputs.action == 'rollback'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # WIF
    environment:
      name: prod
      url: https://runnerforge-orchestrator-gsqedgmwha-ez.a.run.app
    env:
      REVISION: ${{ needs.setup.outputs.target }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Update traffic 100% to ${{ needs.setup.outputs.target }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" \
            --to-revisions="${REVISION}=100" \
            --quiet
