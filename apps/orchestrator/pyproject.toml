[project]
name = "runnerforge"
version = "0.14.0"
description = "Self-hosted runners on GCP for Github Actions"
readme = "README.md"
authors = [{ name = "Ruman Kazi", email = "kaziruman@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "google-cloud-compute>=1.47.0",
    "google-cloud-logging>=3.0.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-gcp-trace>=1.12.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-instrumentation-httpx>=0.63b1",
    "opentelemetry-sdk>=1.42.1",
    "pyjwt[crypto]>=2.13.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runnerforge"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=runnerforge --cov-branch --cov-report term-missing --cov-report html:cov_html"

filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
